<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" th:href="@{/common.css}" />
    <style>
        form { width: 500px; padding: 1em 3em; }
        button:nth-of-type(1) { margin-left: 1em; }
    </style>
</head>
<body>
<div class="container">
    <form method="post" th:object="${departmentEdit}" class="shadow">
        <h1 th:if="${departmentEdit.id > 0}">학과 수정</h1>
        <h1 th:if="${departmentEdit.id == 0}">학과 등록</h1>
        <div class="row">
            <label>학과명:</label>
            <input type="text" th:field="*{name}" />
            <div class="class=error" th:errors="*{name}"></div>
        </div>
        <div class="row">
            <label>단축명:</label>
            <input type="text" th:field="*{shortName}" />
            <div class="class=error" th:errors="*{shortName}"></div>
        </div>
        <div class="row">
            <label>전화:</label>
            <input type="text" th:field="*{phone}" />
            <div class="class=error" th:errors="*{phone}"></div>
        </div>
        <hr />
        <button type="submit" class="btn"
                name="cmd" value="save">저장</button>
        <button type="submit" class="btn"
                th:if="${departmentEdit.id > 0}"
                onclick="return confirm('삭제하시겠습니까?')"
                name="cmd" value="delete">삭제</button>
        <a href="list" class="btn">목록으로</a>
        <span class="error" th:errors="${departmentEdit}"></span>
    </form>
</div>
</body>
</html>
