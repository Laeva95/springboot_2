
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>책 정보 수정</title>
</head>
<body>
    <h1>책 정보 수정</h1>

    <form th:action="@{/books/{id}/edit(id=${bookId})}"
		  th:object="${bookForm}"
          method="post">

		  <div>
		      <label for="title">책 제목</label>
		      <input type="text"
		             id="title"
		             th:field="*{title}">

		      <p th:if="${#fields.hasErrors('title')}"
		         th:errors="*{title}">
		          제목 오류 메시지
		      </p>
		  </div>

		  <div>
		      <label for="author">저자</label>
		      <input type="text"
		             id="author"
		             th:field="*{author}">

		      <p th:if="${#fields.hasErrors('author')}"
		         th:errors="*{author}">
		          저자 오류 메시지
		      </p>
		  </div>

		  <div>
		      <label for="status">독서 상태</label>
		      <select id="status" th:field="*{status}">
		          <option value="">선택해 주세요</option>
		          <option value="PLANNED">읽을 예정</option>
		          <option value="READING">읽는 중</option>
		          <option value="COMPLETED">완독</option>
		      </select>

		      <p th:if="${#fields.hasErrors('status')}"
		         th:errors="*{status}">
		          독서 상태 오류 메시지
		      </p>
		  </div>

        <button type="submit">수정 완료</button>
    </form>

    <p>
        <a th:href="@{/books}">취소하고 목록으로 돌아가기</a>
    </p>
</body>
</html>
