
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>책 목록</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <h1>나의 독서 기록</h1>
	<a th:href="@{/books/search}">
	    YES24에서 도서 검색하기
	</a>

    <p th:if="${message}" th:text="${message}"></p>

    <p>
        <a th:href="@{/books/new}">새 책 등록하기</a>
    </p>
	<!-- 검색 창 -->
	<form th:action="@{/books}" method="get" class="search-form">
	    <!-- th:value= 현재 선택한 독서 상태 전달 -->
		<input type="hidden"
	           name="status"
	           th:value="${selectedStatus}">

		<!-- th:value= 검색 버튼을 눌렀을 때 검색어 유지 -->
	    <input type="text"
	           name="keyword"
	           th:value="${keyword}"
	           placeholder="책 제목 또는 저자 검색">

	    <button type="submit">검색</button>

	    <a th:href="@{/books(status=${selectedStatus})}">
	        초기화
	    </a>
	</form>
	<!-- 책의 독서 상태에 따라 다른 status 값을 컨트롤러의 매개 변수로 전달 -->
	<!-- 값을 설정하지 않으면 'ALL' 값으로 설정 -->
	<div class="filter-group">
		<a class="filter-link"
		   th:classappend="${selectedStatus == 'ALL'} ? ' active' : ''"
		   th:href="@{/books(keyword=${keyword})}">전체</a>

		<a class="filter-link"
		   th:classappend="${selectedStatus == 'PLANNED'} ? ' active' : ''"
		   th:href="@{/books(status='PLANNED', keyword=${keyword})}">읽을 예정</a>

		<a class="filter-link"
		   th:classappend="${selectedStatus == 'READING'} ? ' active' : ''"
		   th:href="@{/books(status='READING', keyword=${keyword})}">읽는 중</a>

		<a class="filter-link"
		   th:classappend="${selectedStatus == 'COMPLETED'} ? ' active' : ''"
		   th:href="@{/books(status='COMPLETED', keyword=${keyword})}">완독</a>
	</div>
	<p>
	    현재 필터:
	    <span th:switch="${selectedStatus}">
	        <span th:case="'ALL'">전체</span>
	        <span th:case="'PLANNED'">읽을 예정</span>
	        <span th:case="'READING'">읽는 중</span>
	        <span th:case="'COMPLETED'">완독</span>
	    </span>
	</p>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>책 제목</th>
                <th>저자</th>
                <th>독서 상태</th>
				<th>시작일</th>
				<th>완독일</th>
				<th>관리</th>
            </tr>
        </thead>

        <tbody>
			<tr th:if="${#lists.isEmpty(books)}">
			    <td colspan="7" class="empty-message">
			        등록된 책이 없습니다.
			    </td>
			</tr>
			<!-- 리스트에서 꺼낸 책 출력 -->
            <tr th:each="book : ${books}">
				<!-- 책 목록 id -->
                <td th:text="${book.id}"></td>
				<!-- 책 제목 -->
                <td th:text="${book.title}"></td>
				<!-- 책 저자 -->
                <td th:text="${book.author}"></td>
				<!-- 책 독서 상태 -->
				<td>
					<!-- 책 독서 상태에 따라 class 속성 값 추가 -->
				    <span class="status-badge"
				          th:classappend="${book.status == 'PLANNED'} ? ' status-planned'
				                        : (${book.status == 'READING'} ? ' status-reading'
				                        : ' status-completed')"
				          th:switch="${book.status}">
				        <span th:case="'PLANNED'">읽을 예정</span>
				        <span th:case="'READING'">읽는 중</span>
				        <span th:case="'COMPLETED'">완독</span>
				    </span>
				</td>
				<!-- 독서 시작일 -->
				<td th:text="${book.startDate != null ? book.startDate : '-'}">
				    -
				</td>

				<!-- 완독일 -->
				<td th:text="${book.completedDate != null ? book.completedDate : '-'}">
				    -
				</td>
				<td>
					<a th:href="@{/books/{id}/edit(id=${book.id})}"
					   class="action-button edit-button">
					    수정
					</a>

					<form th:action="@{/books/{id}/delete(id=${book.id})}"
					      method="post"
					      class="delete-form"
					      onsubmit="return confirm('정말 삭제하시겠습니까?');">
					    <button type="submit"
					            class="action-button delete-button">
					        삭제
					    </button>
					</form>
				</td>
            </tr>
        </tbody>
    </table>
	<!-- 페이징 영역 -->
	<div class="pagination" th:if="${totalPages > 0}">
		<!-- 이전 10페이지 그룹 -->
		<a th:if="${startPage > 0}"
		   th:href="@{/books(page=${startPage - 1}, status=${selectedStatus}, keyword=${keyword})}">
		    ◀◀
		</a>

	    <!-- 이전 페이지 -->
		<!-- 검색 결과가 0건일 경우 페이지 번호 생성하지 않음 -->
	    <a th:if="${currentPage > 0}"
	       th:href="@{/books(page=${currentPage - 1}, status=${selectedStatus}, keyword=${keyword})}">
	        ◀
	    </a>

	    <!-- 페이지 번호 -->
		<!-- ${#numbers.sequence(0, totalPages - 1)}-->
	    <a th:each="pageNum : ${#numbers.sequence(startPage, endPage)}"
	       th:href="@{/books(page=${pageNum}, status=${selectedStatus}, keyword=${keyword})}"
	       th:text="${pageNum + 1}"
	       th:classappend="${pageNum == currentPage} ? ' active' : ''">
	        1
	    </a>

	    <!-- 다음 페이지 -->
	    <a th:if="${currentPage + 1 < totalPages}"
	       th:href="@{/books(page=${currentPage + 1}, status=${selectedStatus}, keyword=${keyword})}">
	        ▶
	    </a>

		<!-- 다음 10페이지 그룹 -->
		<a th:if="${endPage + 1 < totalPages}"
		   th:href="@{/books(page=${endPage + 1}, status=${selectedStatus}, keyword=${keyword})}">
		    ▶▶
		</a>
	</div>
</body>
</html>
